name: Bug
description: Something is broken or wrong.
labels: ["bug"]
projects: ["JohnFunkCode/4"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Prod
        - Test
        - Local
        - Not sure
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce (optional)
      description: Steps, the page or tool, the symbol. Never paste tokens, keys or DSNs.
