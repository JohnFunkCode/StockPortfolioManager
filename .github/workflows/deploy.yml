# Phase 3 Step 10 — CI/CD for the QuantCore platform (architectural standard v2 §10).
#
# PRs + pushes run the gate (tests + wrapper smoke + OpenAPI surface diff), the lean
# install import smoke (requirements-base.lock — the set the containers ship, which the
# gate does NOT install), and a gitleaks secret scan (BYOK packet 8a — a pasted API key
# or PEM in a diff fails CI before it ever lands; allowlist in .gitleaks.toml).
# Pushes to main additionally build the 7 images (Cloud Build, native amd64), apply the pending
# Flyway migrations with the quantcore-migrate Job (#200; a failure stops the roll-out), and roll
# the images out to the Cloud Run services + the report/news Jobs in the TEST project, in two
# parallel phases. Each service's config comes from deploy/cloudrun-services.toml (#161):
# existing services keep everything the inventory doesn't name, a missing public wrapper is
# created from it, and a missing manual service (api, keyproxy, quantui) fails the roll-out.
# Secrets are referenced by Secret Manager name only, so CI never holds the DB DSN or JWT.
#
# One-time setup (see docs/proposals/phase3-gateway-plan.md Step 10): configure Workload
# Identity Federation and set repo secrets GCP_WIF_PROVIDER + GCP_DEPLOY_SA. The deploy
# SA needs roles/run.developer, roles/cloudbuild.builds.editor, roles/artifactregistry.writer,
# and iam.serviceAccountUser on each runtime SA the inventory names (the compute default SA,
# keyproxy-runtime@). Creating a wrapper also needs run.services.setIamPolicy, to make it
# public (docs/architecture/cloudrun-services.md has the grant). PROD-FLIP is deliberately
# NOT automated — it stays a manual, supervised config change (QUANTCORE_DB_DSN / Cloud SQL
# connector).
#
# TRIGGER STATUS — push/PR triggers are RESTORED, but the `deploy` job is guarded by a
# `preflight` job that only emits `has_creds=true` when the GCP_WIF_PROVIDER / GCP_DEPLOY_SA
# repo secrets are present. Until the test-project WIF is wired (run scripts/setup_test_wif.sh),
# those secrets are absent, so `deploy` is SKIPPED — it never fails auth on a `main` push. Once
# the script has created the WIF pool/provider + quantcore-deployer SA and set the two secrets,
# pushes to main auto-roll-out with no further workflow edit. The `gate` job always runs.
# PROD-FLIP stays manual/supervised (QUANTCORE_DB_DSN / Cloud SQL connector) — never automated.
#
# DEPLOY ANY REF TO TEST (#120) — "Run workflow" from main with `ref` set to a branch, tag or
# SHA builds that ref and rolls it out to TEST only (prod stays prod-rollout.yml's digest
# promotion). The gates run on the ref; the deploy machinery (scripts, inventory, this file)
# is main's; scripts/check_deploy_ref.py refuses a ref carrying a migration main doesn't have
# or too old to build every image. Dispatch builds are tagged with the SHA plus scratch
# :dispatch-latest / :buildcache-dispatch tags, NEVER :latest — prod-rollout promotes
# :latest by default. Caveats: test != main until the next push to main reclaims it (the
# run summary names the deployed SHA), and this does not replace a revert PR when main
# itself should be parked at a state. Plan: docs/proposals/deploy-ref-to-test-plan.md.

name: deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build and deploy to TEST (run this from main)"
        required: true
        default: main
  push:
    branches: [main]
  pull_request:

# Serialize deploys per ref so back-to-back merges to main don't race on the same
# Cloud Run services (concurrent `gcloud run deploy` on one service ABORTs with an
# optimistic-lock "version was specified but current version is …" conflict). A new
# run waits for the in-flight one to finish rather than cancelling it mid-rollout.
# Keyed by ref, so PR gate runs (distinct refs) still run in parallel with main. A #120
# dispatch must be run from main, so it shares main's group: it can never race a merge.
# GitHub keeps one PENDING run per group, so a newer queued run replaces an older queued
# one (a dispatch queued behind a merge can be superseded, and vice versa).
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: quantcore-test-20260606
  REGION: us-central1
  AR_REPO: quantcore
  # Every Cloud Run SERVICE's config (sizing included, and why) lives in
  # deploy/cloudrun-services.toml (#161), not here.

jobs:
  gate:
    name: Tests + wrapper smoke + OpenAPI surface
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quantcore
          POSTGRES_PASSWORD: quantcore
          POSTGRES_DB: quantcore
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # init_schema() creates all 22 tables on a blank Postgres; AUTH stays inert.
      QUANTCORE_DB_DSN: postgresql://quantcore:quantcore@localhost:5432/quantcore
      AUTH_DISABLED: "1"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
        with:
          # On a #120 dispatch, test the ref being deployed (empty otherwise: the event's commit).
          ref: ${{ inputs.ref }}
          # Full history so diff-cover can diff PR changes against origin/main.
          fetch-depth: 0
      - id: sha
        # The exact commit tested; deploy builds this SHA, never re-resolves the ref.
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lean deps (+ coverage tooling)
        # The hash-pinned lock (#218), not the .txt floors: CI tests the exact versions the
        # images ship. No pip upgrade, for the same reason the Dockerfiles have none.
        run: pip install --require-hashes -r requirements-dev.lock
      - name: Dependency locks match their inputs
        # A requirements-*.txt edit without a re-lock fails here, not as a drifted image.
        run: |
          pip install uv==0.12.23
          scripts/lock_deps.sh --check
      - name: Unit tests (under coverage)
        run: coverage run -m unittest discover -s tests -t . -v --durations 25
      # COVERAGE RATCHET: the floor below is pinned ~1pt under the measured
      # baseline (66.5% on 2026-07-16, waves 1-3 restored; scope in
      # .coveragerc). It only ever
      # moves UP — when a PR meaningfully raises coverage, bump it in the same
      # PR. The behavioral gate is diff-cover: changed lines need >= 85%.
      - name: Coverage report + floor
        run: |
          coverage report
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          coverage report --fail-under=65
      - name: Diff coverage (changed lines >= 85%, PRs only)
        if: github.event_name == 'pull_request'
        run: |
          coverage xml
          diff-cover coverage.xml --compare-branch "origin/${{ github.base_ref }}" \
            --fail-under 85 --markdown-report diff-cover.md
          cat diff-cover.md >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage HTML artifact
        if: always()
        run: coverage html
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage-html
          path: htmlcov/
          retention-days: 14
      - name: Wrapper smoke (boot each server, assert listTools schemas)
        run: python scripts/ci_wrapper_smoke.py
      - name: OpenAPI surface diff
        run: python scripts/check_openapi_snapshot.py
      - name: Schema snapshot up to date
        run: python scripts/check_schema_snapshot.py
      - name: cloudbuild.yaml is a valid build config
        run: python scripts/check_cloudbuild.py

  # The gate above installs requirements-dev.lock (base + report), but the
  # containers — and prod-rollout.yml's own gate — run on requirements-base.lock
  # alone. Without this job that difference is invisible until a promotion:
  # a module importing matplotlib/jinja2/boto3 passes every PR and fails at the
  # prod gate, which is exactly what happened on 2026-08-10. Separate job rather
  # than a step, because the two dependency sets cannot share a Python
  # environment. Import-only — the gate already runs the tests.
  lean-import:
    name: Lean install import smoke (requirements-base.lock)
    runs-on: ubuntu-latest
    services:
      # api/main.py builds the app at import time, which calls ensure_schema() —
      # so even an import-only smoke needs a database to reach.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quantcore
          POSTGRES_PASSWORD: quantcore
          POSTGRES_DB: quantcore
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      QUANTCORE_DB_DSN: postgresql://quantcore:quantcore@localhost:5432/quantcore
      AUTH_DISABLED: "1"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lean deps (the set the containers ship)
        run: pip install --require-hashes -r requirements-base.lock
      - name: Import smoke
        run: python scripts/ci_lean_import_smoke.py

  frontend-gate:
    name: Frontend tests + typecheck + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc -b --noEmit
      # Thresholds (the frontend ratchet) live in vitest.config.ts — vitest
      # itself fails this step on regression. Baselines noted in that file.
      - name: Vitest with coverage
        run: npx vitest run --coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const s = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${s[k].pct}% (${s[k].covered}/${s[k].total}) |`;
              console.log("### Frontend coverage\n\n| Metric | Coverage |\n|---|---|");
              for (const k of ["lines", "statements", "functions", "branches"]) console.log(row(k));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage-html
          path: frontend/coverage/
          retention-days: 14
      # BYOK packet 8a: the Express proxy's auth tests (IAP-assertion verify +
      # per-user ES256 mint, packet 7b) — a separate npm package with its own
      # lockfile, run with node's built-in test runner.
      - name: QuantUI server tests (frontend/server)
        working-directory: frontend/server
        run: |
          npm ci
          npm test

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # Full history so the scan covers every commit in the push/PR range.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # Known-vulnerability audit of every dependency lock (#218). Deliberately NOT in deploy's
  # `needs`: an advisory published today goes red on every PR (loud), but must not block an
  # unrelated merge or a roll-out. The weekly deps-lock-update.yml runs the same audit.
  dep-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1
      - run: scripts/audit_deps.sh

  preflight:
    name: Check deploy credentials are configured
    needs: gate
    # A push to main, or any #120 dispatch (refused below unless run from main).
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      has_creds: ${{ steps.check.outputs.has_creds }}
    steps:
      - id: check
        # Secrets can't be referenced in a job-level `if`, so probe them here and
        # publish a boolean output the `deploy` job gates on. Absent secrets ⇒ skip,
        # never a hard auth failure.
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          DEPLOY_SA: ${{ secrets.GCP_DEPLOY_SA }}
        run: |
          # The deploy machinery must be main's: a dispatch "from" a branch would run that
          # branch's copy of this file against test. Pick the code with the `ref` input.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error title=run this from main::Dispatch deploy.yml from main and name the code to deploy in the 'ref' input (this run is from $GITHUB_REF)."
            exit 1
          fi
          if [ -n "$WIF_PROVIDER" ] && [ -n "$DEPLOY_SA" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
            echo "Deploy credentials present — deploy job will run."
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "GCP_WIF_PROVIDER / GCP_DEPLOY_SA not set — skipping deploy (run scripts/setup_test_wif.sh)."
          fi

  deploy:
    name: Build + roll out to Cloud Run (test project)
    needs: [gate, lean-import, frontend-gate, secret-scan, preflight]
    if: needs.preflight.outputs.has_creds == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    env:
      # The commit the gate tested: the push's own commit, or the dispatched ref's SHA on a
      # #120 dispatch. The ref input is free text, so a run: block never interpolates it.
      DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
      DEPLOY_REF: ${{ inputs.ref || github.ref_name }}
    steps:
      # main's machinery at the root (scripts, inventory); the code to build under ref/.
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          path: ref
          fetch-depth: 0 # history back to origin/main, for the migration check
      - name: Record the deployed ref and SHA
        # #120: test != main after a dispatch, until the next push to main. This line is
        # the attribution for whoever reads test next, so it goes first and always.
        run: |
          {
            echo "## Deploying to TEST: \`${DEPLOY_REF}\` @ \`${DEPLOY_SHA}\`"
            echo
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              echo "Manual dispatch by @${GITHUB_ACTOR}. Test will differ from main until the next push to main."
            else
              echo "Push to main."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Deploying ${DEPLOY_REF} @ ${DEPLOY_SHA} to TEST"
      - name: Check the ref can deploy (migrations, images)
        run: python3 scripts/check_deploy_ref.py --ref-dir ref --base origin/main
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build + push the 7 images (Cloud Build, amd64)
        # A dispatch builds the ref's tree with scratch latest/cache tags: :latest is what
        # prod-rollout promotes by default, and must only ever be main (#120).
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            LATEST_TAG=dispatch-latest CACHE_TAG=dispatch
          else
            LATEST_TAG=latest CACHE_TAG=main
          fi
          gcloud builds submit ref --project "$PROJECT_ID" \
            --config ref/cloudbuild.yaml \
            --substitutions _TAG="${DEPLOY_SHA::7}",_LATEST_TAG="$LATEST_TAG",_CACHE_TAG="$CACHE_TAG"
      - name: Migrate the database (quantcore-migrate Job)
        # Applies this commit's pending Flyway migrations BEFORE anything rolls out (#200),
        # so no revision ever starts ahead of its schema. A failure here (bad SQL, a
        # refused contract migration, a missing Job) fails the job: the roll-out below
        # never starts and the previous revisions keep serving. The Job is created once
        # by scripts/ensure_migrate_job.sh; the step fails rather than skips without it.
        # Design and recovery: docs/proposals/flyway-automation-plan.md.
        run: |
          scripts/ci_migrate.sh --project "$PROJECT_ID" --region "$REGION" \
            --image "$REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/quantcore-migrate:${DEPLOY_SHA::7}"
      - name: Roll out to Cloud Run (two phases, each in parallel)
        # Every service comes from deploy/cloudrun-services.toml (#161), deployed by
        # scripts/cloudrun_services.py. An existing service gets the new image plus the
        # inventory's scalars (cpu, memory, timeout, ...) on every roll-out, and any env,
        # secret or Cloud SQL entry that differs, with --update-*/--add-* only. A MISSING
        # service is created with its full config when its first_create is "auto" (the
        # public MCP wrappers), and FAILS the roll-out naming its runbook when "manual"
        # (api, keyproxy, quantui). Adding a wrapper is a PR that touches only code and
        # the inventory. IAM model and onboarding: docs/architecture/cloudrun-services.md.
        #
        # Two phases, each in parallel (#296). Every command deploys a DIFFERENT service,
        # so running them at once can't hit the same-service optimistic-lock conflict the
        # concurrency: block guards against. scripts/ci_parallel.sh waits on each PID,
        # prints each command's log in its own group, and fails the step naming every
        # failure. Phase 1 is everything that doesn't consume the new api; phase 2 is
        # api's REST consumers, and runs only if phase 1 succeeded, so an api revision
        # that fails its health check (e.g. SchemaDriftError) fails the run before any
        # consumer rolls onto it. The report + news Jobs are not services; they stay here.
        run: |
          . scripts/ci_parallel.sh
          IMG="$REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPO"
          TAG="${DEPLOY_SHA::7}"
          svc() { python3 scripts/cloudrun_services.py deploy "$1" --env test --registry "$IMG" --tag "$TAG"; }
          P1="$(python3 scripts/cloudrun_services.py names --env test --phase 1)"
          P2="$(python3 scripts/cloudrun_services.py names --env test --phase 2)"
          p1=(); for s in $P1; do p1+=("svc $s"); done
          p2=(); for s in $P2; do p2+=("svc $s"); done

          update_report_job() {
            gcloud run jobs update quantcore-report --project "$PROJECT_ID" --region "$REGION" \
              --image "$IMG/quantcore-report:$TAG" \
              --task-timeout 1800s \
              --max-retries 0 \
              --update-env-vars REPORT_TASK_TIMEOUT_SECONDS=1800,FUNDAMENTALS_WARM_BUDGET_SECONDS=900
          }
          update_news_job() {
            if gcloud run jobs describe quantcore-news --project "$PROJECT_ID" --region "$REGION" >/dev/null 2>&1; then
              gcloud run jobs update quantcore-news --project "$PROJECT_ID" --region "$REGION" \
                --image "$IMG/quantcore-news:$TAG" \
                --task-timeout 1800s \
                --max-retries 0 \
                --update-env-vars NEWS_TASK_TIMEOUT_SECONDS=1800,NEWS_COLLECT_BUDGET_SECONDS=900
            else
              echo "::warning title=quantcore-news missing::quantcore-news Job not found in $PROJECT_ID — news is NOT being collected. Create it with scripts/ensure_news_job.sh."
            fi
          }

          echo "Phase 1:" $P1 "+ the report and news Jobs"
          run_parallel "${p1[@]}" update_report_job update_news_job
          echo "Phase 2:" $P2
          run_parallel "${p2[@]}"
