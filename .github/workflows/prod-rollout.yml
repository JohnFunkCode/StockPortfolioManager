# Prod rollout — promote a tested image set into quantcore-prod-20260606 (Step P9 of
# docs/proposals/prod-rollout-plan.md). This is the GATED, MANUAL counterpart to
# deploy.yml: it is NEVER triggered by a push. An operator dispatches it from main to
# promote an already-built, already-tested image tag from the TEST Artifact Registry into
# the PROD project and roll it out to the prod Cloud Run stack. Dispatch is the only
# trigger (#313): the prod WIF provider admits only main + the `prod` environment, and a
# `release` run would carry a tag ref and be refused at token exchange.
#
# Promotion model — Option B2 (prod-rollout-plan.md locked decision #1): images are
# COPIED BY DIGEST from the test AR into a dedicated prod AR (never rebuilt), so prod
# runs the exact bytes validated on test with no standing cross-project pull at runtime.
# Deploys reference the prod-AR image BY DIGEST for certainty.
#
# Copy mechanism — `docker buildx imagetools create` (registry-to-registry manifest
# copy). NB: `gcloud artifacts docker images copy` does NOT exist in the SDK; gcrane is
# the other option but isn't on the runner. `imagetools create --tag` wraps the copied
# manifest in a NEW OCI index under the prod tag (a different top-level digest), but the
# ORIGINAL manifest is pushed verbatim and stays addressable in the prod AR by its
# original digest — so we resolve that digest and DEPLOY BY IT, never by the prod tag.
#
# Service config comes from deploy/cloudrun-services.toml (#161). An existing service keeps
# everything the inventory doesn't name; a missing public MCP wrapper is CREATED with its
# full config, behind this workflow's `prod` environment approval; a missing manual service
# (api, keyproxy, quantui; the first buildout, plan P5-P7) fails with its runbook. Secrets
# are Secret Manager references, so CI never needs the prod DSN or JWT secret.
#
# One-time setup (see prod-rollout-plan.md):
#   * Prod AR repo `quantcore` exists in us-central1 (plan P2).
#   * A `prod` GitHub Environment with required reviewers (manual approval gate).
#   * Separate WIF for prod: repo secrets GCP_PROD_WIF_PROVIDER + GCP_PROD_DEPLOY_SA.
#     The prod deploy SA needs, in quantcore-prod-20260606: roles/run.developer,
#     roles/artifactregistry.writer (on the prod AR), iam.serviceAccountUser on each runtime
#     SA the inventory names (quantcore-run@, keyproxy-runtime@); and
#     roles/artifactregistry.reader on the TEST AR (to read source digests). Creating a
#     wrapper also needs run.services.setIamPolicy, to make it public
#     (docs/architecture/cloudrun-services.md has the grant).
#     For the migrate step (#200): iam.serviceAccountUser on quantcore-migrate@ and
#     roles/logging.viewer — both granted by scripts/ensure_migrate_job.sh --prod, which
#     also creates the quantcore-migrate Job this workflow updates and executes.
#
# One approval, then unattended (#346). `preflight` (no environment, TEST credentials only)
# resolves every image's digest and the commit, and pre-checks the migrations since the last
# promotion, in seconds; the approval prompt follows it. Everything else, the gate included,
# runs in the single `prod` job after approval: GitHub asks once per environment job, and the
# prod WIF provider forces any job that authenticates to prod onto `environment: prod`. The
# gate steps run BEFORE the prod auth step, so a gate failure touches nothing in prod. The
# prod job copies the digests the preflight showed, never the tag again. Don't rename this
# file: the prod WIF provider's job_workflow_ref pins it. Design and gotchas:
# docs/proposals/single-approval-rollout-plan.md.
#
# PROD-FLIP / first buildout (P1–P8) is deliberately NOT automated — it stays a
# supervised manual sequence. This workflow only handles repeatable image promotion.

name: prod-rollout
run-name: prod-rollout ${{ inputs.image_tag }}

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag in the TEST Artifact Registry to promote (e.g. a 7-char commit SHA, or 'latest')."
        required: true
        default: "latest"
      allow_refused_migrations:
        description: "Let a migration the migrate Job refuses through the preflight. Only after ./scripts/flyway.sh --prod migrate applied it by hand."
        type: boolean
        default: false

# Serialize prod rollouts so two dispatches can't race on the same Cloud Run
# services (concurrent `gcloud run deploy` ABORTs with an optimistic-lock conflict).
# A new run waits for the in-flight one rather than cancelling a mid-rollout deploy.
concurrency:
  group: prod-rollout
  cancel-in-progress: false

env:
  TEST_PROJECT: quantcore-test-20260606
  PROD_PROJECT: quantcore-prod-20260606
  REGION: us-central1
  AR_REPO: quantcore
  # Every Cloud Run SERVICE's config (sizing included, and why) lives in
  # deploy/cloudrun-services.toml (#161), not here.

jobs:
  preflight:
    name: Preflight (resolve digests + commit, pre-check migrations)
    runs-on: ubuntu-latest
    # No environment: this job must finish BEFORE the approval prompt, and it never touches prod.
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write # WIF (TEST project, read-only use of its AR)
      actions: read   # gh run download of the last promoted-sha artifact
    outputs:
      sha: ${{ steps.pre.outputs.sha }}
      api_digest: ${{ steps.pre.outputs.api_digest }}
      mcp_digest: ${{ steps.pre.outputs.mcp_digest }}
      report_digest: ${{ steps.pre.outputs.report_digest }}
      ui_digest: ${{ steps.pre.outputs.ui_digest }}
      keyproxy_digest: ${{ steps.pre.outputs.keyproxy_digest }}
      news_digest: ${{ steps.pre.outputs.news_digest }}
      migrate_digest: ${{ steps.pre.outputs.migrate_digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git diff <last promoted>..<this commit> -- db/migrations
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - id: pre
        name: Resolve + pre-check (summary lists what the approval promotes)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          ALLOW_REFUSED: ${{ inputs.allow_refused_migrations }}
        run: |
          args=(--tag "$IMAGE_TAG")
          if [ "$ALLOW_REFUSED" = "true" ]; then args+=(--allow-refused-migrations); fi
          python3 scripts/prod_preflight.py "${args[@]}"

  promote-and-deploy:
    name: Gate + promote digests (test -> prod AR) + roll out prod Cloud Run
    needs: preflight
    runs-on: ubuntu-latest
    environment: prod # the one manual-approval gate (required reviewers)
    # The clock starts after approval. Gate ~2 min + roll-out max observed ~7 min (2026-10);
    # the default 360 would bill 6 h on a hung Cloud Build wait (#351).
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # Workload Identity Federation (prod)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quantcore
          POSTGRES_PASSWORD: quantcore
          POSTGRES_DB: quantcore
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      QUANTCORE_DB_DSN: postgresql://quantcore:quantcore@localhost:5432/quantcore
      AUTH_DISABLED: "1"
      PYTHONPATH: .
    steps:
      # Also for scripts/ci_parallel.sh (#296), ci_migrate.sh (#200) and the service inventory (#161).
      - uses: actions/checkout@v7
      # The gate, BEFORE the prod auth step: a failure here touches nothing in prod.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lean deps
        run: |
          # The hash-pinned base lock (#218): the same versions the images ship.
          pip install --require-hashes -r requirements-base.lock
      - name: Unit tests
        run: python -m unittest discover -v --durations 25
      - name: Wrapper smoke (boot each server, assert listTools schemas)
        run: python scripts/ci_wrapper_smoke.py
      - name: OpenAPI surface diff
        run: python scripts/check_openapi_snapshot.py

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_PROD_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_PROD_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Manual services exist (read-only, before any change)
        # A missing first_create="manual" service (api, keyproxy, quantui) would fail the
        # roll-out half-way, after the promotion and migration. Fail it here instead.
        run: python3 scripts/cloudrun_services.py check --env prod --missing-manual

      - name: Copy the preflight's digests into the prod AR (imagetools)
        env:
          SHA: ${{ needs.preflight.outputs.sha }}
          QUANTCORE_API_SRC_DIGEST: ${{ needs.preflight.outputs.api_digest }}
          QUANTCORE_MCP_SRC_DIGEST: ${{ needs.preflight.outputs.mcp_digest }}
          QUANTCORE_REPORT_SRC_DIGEST: ${{ needs.preflight.outputs.report_digest }}
          QUANTCORE_UI_SRC_DIGEST: ${{ needs.preflight.outputs.ui_digest }}
          QUANTCORE_KEYPROXY_SRC_DIGEST: ${{ needs.preflight.outputs.keyproxy_digest }}
          QUANTCORE_NEWS_SRC_DIGEST: ${{ needs.preflight.outputs.news_digest }}
          QUANTCORE_MIGRATE_SRC_DIGEST: ${{ needs.preflight.outputs.migrate_digest }}
        run: |
          set -euo pipefail
          # Wire docker to the AR registry using the WIF credentials from the auth step.
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          TAG="${{ inputs.image_tag }}"
          echo "Promoting tag '$TAG' (commit $SHA) from $TEST_PROJECT -> $PROD_PROJECT"
          # The digests come from the preflight, which the approver saw (#346): never re-read
          # the tag, so a tag moved after approval can't change what ships. quantcore-migrate
          # is strict like api (the preflight fails without it); keyproxy and news may be
          # absent on tags that predate them, and arrive here as an empty digest.
          for img in quantcore-api quantcore-mcp quantcore-report quantcore-ui quantcore-keyproxy quantcore-news quantcore-migrate; do
            key="$(echo "$img" | tr 'a-z-' 'A-Z_')"
            src_key="${key}_SRC_DIGEST"
            DIGEST="${!src_key:-}"
            if [ -z "$DIGEST" ]; then
              # Belt and braces: the preflight already failed on any other image.
              if [ "$img" = "quantcore-keyproxy" ] || [ "$img" = "quantcore-news" ]; then
                echo "$img:$TAG not in the test AR (tag predates it) — skipping its promotion."
                continue
              fi
              echo "::error title=$img missing::the preflight bound no digest for $img"; exit 1
            fi
            NOW="$(gcloud artifacts docker images describe \
              "$REGION-docker.pkg.dev/$TEST_PROJECT/$AR_REPO/$img:$TAG" \
              --format='value(image_summary.digest)' 2>/dev/null || true)"
            if [ "$NOW" != "$DIGEST" ]; then
              echo "::notice title=$img tag moved::$img:$TAG is now ${NOW:-gone}; promoting the approved $DIGEST"
            fi
            echo "$img @ $DIGEST"
            # Registry-to-registry manifest copy. The prod tag ends up on a NEW OCI index
            # (imagetools wraps it), but the original manifest is pushed verbatim and so is
            # addressable in the prod AR by $DIGEST — which is what we deploy.
            docker buildx imagetools create \
              --tag "$REGION-docker.pkg.dev/$PROD_PROJECT/$AR_REPO/$img:$TAG" \
              "$REGION-docker.pkg.dev/$TEST_PROJECT/$AR_REPO/$img@$DIGEST"
            # Verify the original digest resolves byte-identically in the prod AR before we
            # roll anything out (fail fast if the copy didn't land the manifest).
            gcloud artifacts docker images describe \
              "$REGION-docker.pkg.dev/$PROD_PROJECT/$AR_REPO/$img@$DIGEST" \
              --format='value(image_summary.digest)' >/dev/null
            # Export the digest for the deploy steps (deploy by digest, not tag).
            echo "${key}_DIGEST=$DIGEST" >> "$GITHUB_ENV"
          done

      - name: Migrate the prod database (quantcore-migrate Job, by digest)
        # Issue #200: apply pending Flyway migrations BEFORE anything rolls out, so an image
        # never runs ahead of its schema. Same script as deploy.yml's step. It fails (and so
        # stops the roll-out, the previous revisions keep serving) if the Job is missing,
        # the migration fails, or a pending migration is a refused contract change.
        # By the digest the promotion just copied, never a tag (PR #305 review): a tag in
        # the prod AR points at the imagetools index, not the bytes tested on test.
        # No `if:` and no continue-on-error, deliberately; tests/test_ci_migrate.py checks.
        run: |
          scripts/ci_migrate.sh --project "$PROD_PROJECT" --region "$REGION" \
            --image "$REGION-docker.pkg.dev/$PROD_PROJECT/$AR_REPO/quantcore-migrate@${QUANTCORE_MIGRATE_DIGEST:?quantcore-migrate was not promoted}"

      - name: Roll out prod Cloud Run (two phases, each in parallel; by digest)
        # Every service comes from deploy/cloudrun-services.toml (#161), deployed by
        # scripts/cloudrun_services.py. An existing service gets the new image plus the
        # inventory's scalars (cpu, memory, timeout, ...) on every roll-out, and any env,
        # secret or Cloud SQL entry that differs, with --update-*/--add-* only. A MISSING
        # service is created with its full config when its first_create is "auto" (the
        # public MCP wrappers), and FAILS the roll-out naming its runbook when "manual"
        # (api, keyproxy, quantui). Adding a wrapper is a PR that touches only code and
        # the inventory. IAM model and onboarding: docs/architecture/cloudrun-services.md.
        # By digest: each service's image@$QUANTCORE_<IMAGE>_DIGEST, as the promotion
        # exported it. keyproxy skips when its image wasn't promoted (a pre-8a tag).
        #
        # Two phases, each in parallel (#296). Every command deploys a DIFFERENT service,
        # so running them at once can't hit the same-service optimistic-lock conflict the
        # concurrency: block guards against. scripts/ci_parallel.sh waits on each PID,
        # prints each command's log in its own group, and fails the step naming every
        # failure. Phase 1 is everything that doesn't consume the new api; phase 2 is
        # api's REST consumers, and runs only if phase 1 succeeded, so an api revision
        # that fails its health check (e.g. SchemaDriftError) fails the run before any
        # consumer rolls onto it. The report + news Jobs are not services; they stay here.
        run: |
          . scripts/ci_parallel.sh
          IMG="$REGION-docker.pkg.dev/$PROD_PROJECT/$AR_REPO"
          svc() { python3 scripts/cloudrun_services.py deploy "$1" --env prod --registry "$IMG" --by-digest; }
          P1="$(python3 scripts/cloudrun_services.py names --env prod --phase 1)"
          P2="$(python3 scripts/cloudrun_services.py names --env prod --phase 2)"
          p1=(); for s in $P1; do p1+=("svc $s"); done
          p2=(); for s in $P2; do p2+=("svc $s"); done

          update_report_job() {
            gcloud run jobs update quantcore-report --project "$PROD_PROJECT" --region "$REGION" \
              --image "$IMG/quantcore-report@$QUANTCORE_REPORT_DIGEST" \
              --task-timeout 1800s \
              --max-retries 0 \
              --update-env-vars REPORT_TASK_TIMEOUT_SECONDS=1800,FUNDAMENTALS_WARM_BUDGET_SECONDS=900
          }
          update_news_job() {
            if [ -z "${QUANTCORE_NEWS_DIGEST:-}" ]; then
              echo "quantcore-news was not promoted for this tag — skipping."
            elif gcloud run jobs describe quantcore-news --project "$PROD_PROJECT" --region "$REGION" >/dev/null 2>&1; then
              gcloud run jobs update quantcore-news --project "$PROD_PROJECT" --region "$REGION" \
                --image "$IMG/quantcore-news@$QUANTCORE_NEWS_DIGEST" \
                --task-timeout 1800s \
                --max-retries 0 \
                --update-env-vars NEWS_TASK_TIMEOUT_SECONDS=1800,NEWS_COLLECT_BUDGET_SECONDS=900
            else
              echo "::warning title=quantcore-news missing::quantcore-news Job not found in $PROD_PROJECT — news is NOT being collected. Create it with scripts/ensure_news_job.sh --prod."
            fi
          }

          echo "Phase 1:" $P1 "+ the report and news Jobs"
          run_parallel "${p1[@]}" update_report_job update_news_job
          echo "Phase 2:" $P2
          run_parallel "${p2[@]}"

      # Last, success-only (the default `if: success()`): the next run's preflight diffs the
      # migrations since this commit. A failed roll-out records nothing, so the next diff still
      # starts from the last commit that actually reached prod.
      - name: Record the promoted commit
        run: echo "${{ needs.preflight.outputs.sha }}" > promoted-sha.txt
      - uses: actions/upload-artifact@v7
        with:
          name: promoted-sha
          path: promoted-sha.txt
          retention-days: 90
