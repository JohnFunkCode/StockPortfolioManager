# Prod rollout — promote a tested image set into quantcore-prod-20260606 (Step P9 of
# docs/proposals/prod-rollout-plan.md). This is the GATED, MANUAL counterpart to
# deploy.yml: it is NEVER triggered by a push. An operator dispatches it (or it fires
# on a release tag) to promote an already-built, already-tested image tag from the TEST
# Artifact Registry into the PROD project and roll it out to the prod Cloud Run stack.
#
# Promotion model — Option B2 (prod-rollout-plan.md locked decision #1): images are
# COPIED BY DIGEST from the test AR into a dedicated prod AR (never rebuilt), so prod
# runs the exact bytes validated on test with no standing cross-project pull at runtime.
# Deploys reference the prod-AR image BY DIGEST for certainty.
#
# Copy mechanism — `docker buildx imagetools create` (registry-to-registry manifest
# copy). NB: `gcloud artifacts docker images copy` does NOT exist in the SDK; gcrane is
# the other option but isn't on the runner. `imagetools create --tag` wraps the copied
# manifest in a NEW OCI index under the prod tag (a different top-level digest), but the
# ORIGINAL manifest is pushed verbatim and stays addressable in the prod AR by its
# original digest — so we resolve that digest and DEPLOY BY IT, never by the prod tag.
#
# First prod deploy is MANUAL (plan steps P5–P7): each service/job is created once with
# its full config (Cloud SQL binding, --set-secrets prod DSN/JWT, ingress, resources).
# This workflow then carries ONLY the new image digest on every subsequent rollout, so
# that per-service config is preserved — CI never needs the prod DSN or JWT secret.
#
# One-time setup (see prod-rollout-plan.md):
#   * Prod AR repo `quantcore` exists in us-central1 (plan P2).
#   * A `prod` GitHub Environment with required reviewers (manual approval gate).
#   * Separate WIF for prod: repo secrets GCP_PROD_WIF_PROVIDER + GCP_PROD_DEPLOY_SA.
#     The prod deploy SA needs, in quantcore-prod-20260606: roles/run.developer,
#     roles/artifactregistry.writer (on the prod AR), iam.serviceAccountUser on the prod
#     runtime SA; and roles/artifactregistry.reader on the TEST AR (to read source digests).
#
# PROD-FLIP / first buildout (P1–P8) is deliberately NOT automated — it stays a
# supervised manual sequence. This workflow only handles repeatable image promotion.

name: prod-rollout

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag in the TEST Artifact Registry to promote (e.g. a 7-char commit SHA, or 'latest')."
        required: true
        default: "latest"
  release:
    types: [published]

# Serialize prod rollouts so two dispatches/releases can't race on the same Cloud Run
# services (concurrent `gcloud run deploy` ABORTs with an optimistic-lock conflict).
# A new run waits for the in-flight one rather than cancelling a mid-rollout deploy.
concurrency:
  group: prod-rollout
  cancel-in-progress: false

env:
  TEST_PROJECT: quantcore-test-20260606
  PROD_PROJECT: quantcore-prod-20260606
  REGION: us-central1
  AR_REPO: quantcore
  MCP_REQUEST_TIMEOUT: 900s
  # Cloud Run sizing, pinned so every roll-out RE-ASSERTS it (2026-09-09).
  #
  # These values used to live only as live Cloud Run config from each service's manual
  # first deploy, which meant a `--set-*` slip or a service recreate could silently
  # revert them with nothing in the repo to notice. Deploys here stay image-only for
  # env/secrets/Cloud-SQL bindings; sizing is the one shape we now carry explicitly.
  #
  # The 7 wrappers were downsized after 14 days of utilization data (<1% mean CPU,
  # ~6% mean memory). CPU stays at 1 EVERYWHERE and must not be lowered: Cloud Run
  # rejects <1 vCPU while containerConcurrency > 1, and every service here runs at 80+
  # ("Total cpu < 1 is not supported with concurrency > 1"). Dropping concurrency to
  # buy 0.5 vCPU would cost more, not less — the wrappers hold 900s MCP sessions, so
  # one session per instance means more instances.
  #
  # quantcore-api stays 2 CPU / 4Gi DELIBERATELY. Its mean memory is ~6% but its peak
  # is 58% of 4Gi (~2.4GiB, full options chains at concurrency 160), so halving it to
  # 2Gi is an OOM, not a tight fit. The mean is the number that hides this.
  # It also deploys with --cpu-boost (issue #280): extra CPU during startup only, so a
  # cold start's torch import / baked-FinBERT load finishes sooner. Billed only for
  # the boosted seconds; the flag sits on the api deploy step below, not in this block.
  API_CPU: "2"
  API_MEMORY: 4Gi
  MCP_CPU: "1"
  MCP_MEMORY: 512Mi
  MCP_MEMORY_LITE: 256Mi # portfolio + arbitrage — the two thinnest wrappers
  UI_CPU: "1"
  UI_MEMORY: 512Mi
  KEYPROXY_CPU: "1"
  KEYPROXY_MEMORY: 512Mi

jobs:
  gate:
    name: Tests + wrapper smoke + OpenAPI surface
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quantcore
          POSTGRES_PASSWORD: quantcore
          POSTGRES_DB: quantcore
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      QUANTCORE_DB_DSN: postgresql://quantcore:quantcore@localhost:5432/quantcore
      AUTH_DISABLED: "1"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lean deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-base.txt
      - name: Unit tests
        run: python -m unittest discover -v --durations 25
      - name: Wrapper smoke (boot each server, assert listTools schemas)
        run: python scripts/ci_wrapper_smoke.py
      - name: OpenAPI surface diff
        run: python scripts/check_openapi_snapshot.py

  promote-and-deploy:
    name: Promote digests (test -> prod AR) + roll out prod Cloud Run
    needs: gate
    runs-on: ubuntu-latest
    environment: prod # manual-approval gate (required reviewers)
    permissions:
      contents: read
      id-token: write # Workload Identity Federation (prod)
    steps:
      # Only for scripts/ci_parallel.sh, which the roll-out step sources (#296).
      - uses: actions/checkout@v7
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_PROD_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_PROD_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Resolve source digests + copy by digest into the prod AR (imagetools)
        run: |
          set -euo pipefail
          # Wire docker to the AR registry using the WIF credentials from the auth step.
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          TAG="${{ github.event.inputs.image_tag || github.event.release.tag_name }}"
          echo "Promoting tag '$TAG' from $TEST_PROJECT -> $PROD_PROJECT"
          for img in quantcore-api quantcore-mcp quantcore-report quantcore-ui quantcore-keyproxy quantcore-news; do
            SRC_TAGGED="$REGION-docker.pkg.dev/$TEST_PROJECT/$AR_REPO/$img:$TAG"
            # Resolve the immutable source-manifest digest so the copy + deploy reference
            # exact bytes. quantcore-keyproxy (BYOK packet 8a) tolerates an absent source
            # image so tags built before 8a landed stay promotable; the others stay strict.
            if { [ "$img" = "quantcore-keyproxy" ] || [ "$img" = "quantcore-news" ]; } && ! gcloud artifacts docker images describe \
                "$SRC_TAGGED" --format='value(image_summary.digest)' >/dev/null 2>&1; then
              echo "$img:$TAG not in the test AR (tag predates it) — skipping its promotion."
              continue
            fi
            DIGEST="$(gcloud artifacts docker images describe "$SRC_TAGGED" \
              --format='value(image_summary.digest)')"
            echo "$img @ $DIGEST"
            # Registry-to-registry manifest copy. The prod tag ends up on a NEW OCI index
            # (imagetools wraps it), but the original manifest is pushed verbatim and so is
            # addressable in the prod AR by $DIGEST — which is what we deploy.
            docker buildx imagetools create \
              --tag "$REGION-docker.pkg.dev/$PROD_PROJECT/$AR_REPO/$img:$TAG" \
              "$REGION-docker.pkg.dev/$TEST_PROJECT/$AR_REPO/$img@$DIGEST"
            # Verify the original digest resolves byte-identically in the prod AR before we
            # roll anything out (fail fast if the copy didn't land the manifest).
            gcloud artifacts docker images describe \
              "$REGION-docker.pkg.dev/$PROD_PROJECT/$AR_REPO/$img@$DIGEST" \
              --format='value(image_summary.digest)' >/dev/null
            # Export the digest for the deploy steps (deploy by digest, not tag).
            key="$(echo "$img" | tr 'a-z-' 'A-Z_')_DIGEST"
            echo "$key=$DIGEST" >> "$GITHUB_ENV"
          done

      - name: Roll out prod Cloud Run (two phases, each in parallel; by digest)
        # Runs only after every digest above landed in the prod AR, and deploys BY those
        # digests. Every command deploys a DIFFERENT service, so running them at once
        # can't hit the same-service optimistic-lock conflict the concurrency: block
        # guards against (#296). scripts/ci_parallel.sh waits on each PID, prints each
        # command's log in its own group, and fails the step naming every failure.
        #
        # Phase 1 is everything that doesn't consume the new api; phase 2 is api's REST
        # consumers (the 7 wrappers and quantui), and runs only if phase 1 succeeded, so
        # an api revision that fails its health check (e.g. SchemaDriftError) fails the
        # run before any consumer rolls onto it.
        #
        # Every first prod deploy is MANUAL with full config (plan P5–P7); these
        # image-only redeploys preserve it. Guards, each annotated when it skips (#163):
        #   quantcore-arbitrage / -portfolio: created manually (portfolio-lots-plan.md
        #     Step 4.8a; arbitrage is SERVER_MODULE=fastMCPTest.arbitrage_server,
        #     PORT=6007). deploy.yml carried portfolio for test long before prod did, so
        #     the prod service (created 2026-07-29) once went without an image.
        #   quantcore-keyproxy: the packet-8b runbook (dedicated runtime SA, its two
        #     secrets, IAM-locked invoker); also skipped for a pre-8a tag (no digest).
        #   quantcore-news: skipped for a tag that predates it (no digest).
        #   quantui: unguarded. Its manual --iap deploy (quantui-iap-plan.md Step 8)
        #     already exists in prod.
        run: |
          . scripts/ci_parallel.sh
          IMG="$REGION-docker.pkg.dev/$PROD_PROJECT/$AR_REPO"

          exists() { gcloud run services describe "$1" --project "$PROD_PROJECT" --region "$REGION" >/dev/null 2>&1; }

          deploy_api() {
            gcloud run deploy quantcore-api --project "$PROD_PROJECT" --region "$REGION" \
              --cpu "$API_CPU" --memory "$API_MEMORY" --cpu-boost \
              --image "$IMG/quantcore-api@$QUANTCORE_API_DIGEST"
          }
          update_report_job() {
            gcloud run jobs update quantcore-report --project "$PROD_PROJECT" --region "$REGION" \
              --image "$IMG/quantcore-report@$QUANTCORE_REPORT_DIGEST" \
              --task-timeout 1800s \
              --max-retries 0 \
              --update-env-vars REPORT_TASK_TIMEOUT_SECONDS=1800,FUNDAMENTALS_WARM_BUDGET_SECONDS=900
          }
          update_news_job() {
            if [ -z "${QUANTCORE_NEWS_DIGEST:-}" ]; then
              echo "quantcore-news was not promoted for this tag — skipping."
            elif gcloud run jobs describe quantcore-news --project "$PROD_PROJECT" --region "$REGION" >/dev/null 2>&1; then
              gcloud run jobs update quantcore-news --project "$PROD_PROJECT" --region "$REGION" \
                --image "$IMG/quantcore-news@$QUANTCORE_NEWS_DIGEST" \
                --task-timeout 1800s \
                --max-retries 0 \
                --update-env-vars NEWS_TASK_TIMEOUT_SECONDS=1800,NEWS_COLLECT_BUDGET_SECONDS=900
            else
              echo "::warning title=quantcore-news missing::quantcore-news Job not found in $PROD_PROJECT — news is NOT being collected. Create it with scripts/ensure_news_job.sh --prod."
            fi
          }
          deploy_keyproxy() {
            if [ -z "${QUANTCORE_KEYPROXY_DIGEST:-}" ]; then
              echo "no promoted keyproxy digest for this tag — skipping."
            elif exists quantcore-keyproxy; then
              gcloud run deploy quantcore-keyproxy --project "$PROD_PROJECT" --region "$REGION" \
                --cpu "$KEYPROXY_CPU" --memory "$KEYPROXY_MEMORY" \
                --image "$IMG/quantcore-keyproxy@$QUANTCORE_KEYPROXY_DIGEST"
            else
              echo "::warning title=quantcore-keyproxy missing::quantcore-keyproxy not found in $PROD_PROJECT — Sidekick chat cannot reach Anthropic and this roll-out skipped it. First deploy is the packet-8b runbook (byok-key-proxy-plan.md)."
            fi
          }
          # The 5 original wrappers share the mcp image; per-service env is preserved.
          deploy_wrapper() {
            gcloud run deploy "quantcore-$1" --project "$PROD_PROJECT" --region "$REGION" \
              --timeout "$MCP_REQUEST_TIMEOUT" \
              --cpu "$MCP_CPU" --memory "$MCP_MEMORY" \
              --image "$IMG/quantcore-mcp@$QUANTCORE_MCP_DIGEST"
          }
          # portfolio + arbitrage: same image, lite memory, manual first deploy.
          deploy_lite_wrapper() {
            if exists "quantcore-$1"; then
              gcloud run deploy "quantcore-$1" --project "$PROD_PROJECT" --region "$REGION" \
                --timeout "$MCP_REQUEST_TIMEOUT" \
                --cpu "$MCP_CPU" --memory "$MCP_MEMORY_LITE" \
                --image "$IMG/quantcore-mcp@$QUANTCORE_MCP_DIGEST"
            else
              echo "::warning title=quantcore-$1 missing::quantcore-$1 not found in $PROD_PROJECT — its MCP tools are unreachable and this roll-out skipped it. Create it per portfolio-lots-plan.md Step 4.8a."
            fi
          }
          deploy_quantui() {
            gcloud run deploy quantui --project "$PROD_PROJECT" --region "$REGION" \
              --cpu "$UI_CPU" --memory "$UI_MEMORY" \
              --image "$IMG/quantcore-ui@$QUANTCORE_UI_DIGEST"
          }

          echo "Phase 1: quantcore-api, the report + news Jobs, quantcore-keyproxy"
          run_parallel deploy_api update_report_job update_news_job deploy_keyproxy
          echo "Phase 2: api's consumers (the 7 wrappers, quantui)"
          run_parallel \
            "deploy_wrapper stock-price" "deploy_wrapper options-analysis" \
            "deploy_wrapper company-fundamentals" "deploy_wrapper news-sentiment" \
            "deploy_wrapper market-analysis" \
            "deploy_lite_wrapper portfolio" "deploy_lite_wrapper arbitrage" \
            deploy_quantui
