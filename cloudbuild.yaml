# cloudbuild.yaml — Phase 3 Step 7: build + push the QuantCore images.
#
# Built natively on linux/amd64 in Cloud Build (the local dev host is arm64, so a
# local build would need slow QEMU emulation — especially for the torch-bearing api
# image). Each build step pushes an immutable :${_TAG} (a git short SHA when
# invoked from CI/the helper) itself (`--push`); the final tag-latest step then
# points the moving :${_LATEST_TAG} at that same digest once all six have built.
# There is no `images:` block: buildx pushes from inside its own builder.
#
# Images (one mcp image is reused by all five wrappers — server + port are
# selected at run time via SERVER_MODULE/PORT env, see mcp_gateway/serve.py):
#   quantcore-api       FastAPI front door + services in-process (carries FinBERT/torch)
#   quantcore-mcp       the shared thin MCP wrapper image
#   quantcore-report    main.py once-and-exit (Cloud Run Job)
#   quantcore-news      news_job.py once-and-exit (Cloud Run Job; FinBERT/torch)
#   quantcore-ui        React/Vite SPA + /api proxy (built from the frontend/ context)
#   quantcore-keyproxy  BYOK key-redemption proxy (lean FastAPI, keyproxy/ only)
#
# Manual invocation (from repo root):
#   gcloud builds submit --project quantcore-test-20260606 --config cloudbuild.yaml \
#       --substitutions _TAG=$(git rev-parse --short HEAD),_DEPS_EPOCH=$(date -u +%G-W%V)
# A trial build must also pass scratch _CACHE_TAG and _LATEST_TAG values, so it
# neither reads/writes main's cache nor moves :latest (prod-rollout's default).
#
# Speed (#278, docs/proposals/cloud-build-speed-plan.md). Every worker starts
# cold, so each step pulls a registry layer cache (:buildcache-${_CACHE_TAG}) and
# writes it back with mode=max — every layer of every stage, whether it was
# rebuilt or restored. An unchanged layer then keeps its digest, so the push
# skips it too. This replaced the stock docker builder's inline cache, whose
# BuildKit (v0.8, Docker 20.10) re-exported only the layers it actually ran: a
# warm build left :latest describing just `COPY . .`, so main alternated warm
# and cold. The builder step creates a docker-container BuildKit for that.
# --provenance=false keeps each image a plain manifest (no attestation index)
# for prod-rollout's copy by digest. _DEPS_EPOCH busts the pip layers once a
# week, because a cached install would otherwise never move past the `>=`
# floors it first resolved. All six builds run in parallel after the builder.

substitutions:
  _REGION: us-central1
  _PROJECT: quantcore-test-20260606
  _REPO: quantcore
  _TAG: latest
  # Each image's registry layer cache lives at :buildcache-${_CACHE_TAG} (#296
  # follow-up). Overridable so a trial build warms from, and writes to, a
  # scratch cache instead of main's.
  _CACHE_TAG: main
  # The rolling tag moved once every image has built. A trial overrides it with
  # a scratch tag: prod-rollout's default tag is latest, so a trial must never
  # move it.
  _LATEST_TAG: latest
  # The BuildKit the builder step runs — pinned, so a BuildKit release can't
  # change the cache format under us between two merges.
  _BUILDKIT_IMAGE: mirror.gcr.io/moby/buildkit:v0.23.2
  # ISO week from deploy.yml; empty for a manual build (a cache miss on the pip
  # layers that week, never a wrong image).
  _DEPS_EPOCH: ""
  # BYOK packet 8b — SPKI pins for the browser envelope layer, baked into the
  # UI bundle at build time (frontend/src/vault/envelope.ts refuses to encrypt
  # against any key not on this list). BOTH projects' pins ride in the one
  # image because prod promotion copies it by digest (never rebuilds): the
  # test keyproxy's kp-2026-07-test pin first, prod's kp-2026-07-prod second.
  # Pins are public values (SHA-256 of a public key). On rotation, ship
  # old+new here, add the new PEM to the keyproxy-private-key secret bundle,
  # then drop the old pin in the next release.
  _VITE_KEYPROXY_SPKI_PINS: "pzWt6lfgPH4Ef8CVZUzW3GXo88v5MRKKPQq9IQe4VqE,3YQ7LqMEiKf_-FBcoui-kfDjHJQgV-QzyrmDOcDNxGY"

options:
  machineType: E2_HIGHCPU_8         # faster torch image build
  logging: CLOUD_LOGGING_ONLY       # avoid the "logs bucket required" failure mode

timeout: 3600s

steps:
  # One BuildKit for every build step: a docker-container builder, because the
  # daemon's embedded BuildKit (docker driver) can only write inline cache, and
  # that is what made main alternate warm/cold (see the header).
  - name: gcr.io/cloud-builders/docker
    id: builder
    waitFor: ['-']
    args:
      - buildx
      - create
      - --name
      - quantcore
      - --driver
      - docker-container
      - --driver-opt
      - image=${_BUILDKIT_IMAGE}
      - --bootstrap

  # --- api (Dockerfile.api) ---
  - name: gcr.io/cloud-builders/docker
    id: build-api
    waitFor: [builder]
    args:
      - buildx
      - build
      - --builder
      - quantcore
      - -f
      - Dockerfile.api
      - --cache-from
      - type=registry,ref=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/quantcore-api:buildcache-${_CACHE_TAG}
      - --cache-to
      - type=registry,ref=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/quantcore-api:buildcache-${_CACHE_TAG},mode=max,image-manifest=true,oci-mediatypes=true
      - --provenance=false
      - --build-arg
      - DEPS_EPOCH=${_DEPS_EPOCH}
      - -t
      - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/quantcore-api:${_TAG}
      - --push
      - .

  # --- mcp (Dockerfile.mcp) — one image for all 5 wrappers ---
  - name: gcr.io/cloud-builders/docker
    id: build-mcp
    waitFor: [builder]
    args:
      - buildx
      - build
      - --builder
      - quantcore
      - -f
      - Dockerfile.mcp
      - --cache-from
      - type=registry,ref=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/quantcore-mcp:buildcache-${_CACHE_TAG}
      - --cache-to
      - type=registry,ref=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/quantcore-mcp:buildcache-${_CACHE_TAG},mode=max,image-manifest=true,oci-mediatypes=true
      - --provenance=false
      - --build-arg
      - DEPS_EPOCH=${_DEPS_EPOCH}
      - -t
      - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/quantcore-mcp:${_TAG}
      - --push
      - .

  # --- news collector (Dockerfile.news) ---
  - name: gcr.io/cloud-builders/docker
    id: build-news
    waitFor: [builder]
    args:
      - buildx
      - build
      - --builder
      - quantcore
      - -f
      - Dockerfile.news
      - --cache-from
      - type=registry,ref=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/quantcore-news:buildcache-${_CACHE_TAG}
      - --cache-to
      - type=registry,ref=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/quantcore-news:buildcache-${_CACHE_TAG},mode=max,image-manifest=true,oci-mediatypes=true
      - --provenance=false
      - --build-arg
      - DEPS_EPOCH=${_DEPS_EPOCH}
      - -t
      - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/quantcore-news:${_TAG}
      - --push
      - .

  # --- report (Dockerfile.report) ---
  - name: gcr.io/cloud-builders/docker
    id: build-report
    waitFor: [builder]
    args:
      - buildx
      - build
      - --builder
      - quantcore
      - -f
      - Dockerfile.report
      - --cache-from
      - type=registry,ref=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/quantcore-report:buildcache-${_CACHE_TAG}
      - --cache-to
      - type=registry,ref=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/quantcore-report:buildcache-${_CACHE_TAG},mode=max,image-manifest=true,oci-mediatypes=true
      - --provenance=false
      - --build-arg
      - DEPS_EPOCH=${_DEPS_EPOCH}
      - -t
      - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/quantcore-report:${_TAG}
      - --push
      - .

  # --- ui (Dockerfile.ui) — React/Vite SPA + /api proxy; build context is frontend/
  #     (the repo-root .dockerignore excludes frontend/ from the python images). ---
  - name: gcr.io/cloud-builders/docker
    id: build-ui
    waitFor: [builder]
    args:
      - buildx
      - build
      - --builder
      - quantcore
      - -f
      - Dockerfile.ui
      - --cache-from
      - type=registry,ref=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/quantcore-ui:buildcache-${_CACHE_TAG}
      - --cache-to
      - type=registry,ref=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/quantcore-ui:buildcache-${_CACHE_TAG},mode=max,image-manifest=true,oci-mediatypes=true
      - --provenance=false
      - --build-arg
      - VITE_KEYPROXY_SPKI_PINS=${_VITE_KEYPROXY_SPKI_PINS}
      - -t
      - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/quantcore-ui:${_TAG}
      - --push
      - frontend

  # --- keyproxy (Dockerfile.keyproxy) — BYOK key-redemption proxy (packet 8a) ---
  - name: gcr.io/cloud-builders/docker
    id: build-keyproxy
    waitFor: [builder]
    args:
      - buildx
      - build
      - --builder
      - quantcore
      - -f
      - Dockerfile.keyproxy
      - --cache-from
      - type=registry,ref=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/quantcore-keyproxy:buildcache-${_CACHE_TAG}
      - --cache-to
      - type=registry,ref=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/quantcore-keyproxy:buildcache-${_CACHE_TAG},mode=max,image-manifest=true,oci-mediatypes=true
      - --provenance=false
      - --build-arg
      - DEPS_EPOCH=${_DEPS_EPOCH}
      - -t
      - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/quantcore-keyproxy:${_TAG}
      - --push
      - .

  # Move the rolling tag only once every image has built, as the `images:` block
  # used to: a failed step must not leave :latest pointing at a mixed set. `tags
  # add` re-points the tag at the same manifest digest — never a new index.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: tag-latest
    waitFor: [build-api, build-mcp, build-news, build-report, build-ui, build-keyproxy]
    entrypoint: bash
    args:
      - -ceu
      - |
        gcloud artifacts docker tags add --quiet ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/quantcore-api:${_TAG} ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/quantcore-api:${_LATEST_TAG}
        gcloud artifacts docker tags add --quiet ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/quantcore-mcp:${_TAG} ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/quantcore-mcp:${_LATEST_TAG}
        gcloud artifacts docker tags add --quiet ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/quantcore-news:${_TAG} ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/quantcore-news:${_LATEST_TAG}
        gcloud artifacts docker tags add --quiet ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/quantcore-report:${_TAG} ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/quantcore-report:${_LATEST_TAG}
        gcloud artifacts docker tags add --quiet ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/quantcore-ui:${_TAG} ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/quantcore-ui:${_LATEST_TAG}
        gcloud artifacts docker tags add --quiet ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/quantcore-keyproxy:${_TAG} ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/quantcore-keyproxy:${_LATEST_TAG}
